<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guilherme Duarte | Links</title>

    <!-- Ícones Font Awesome -->
    <link rel="stylesheet" href="https://cloudflare.com">

    <!-- Fonte Inter do Google Fonts -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Arquivo CSS separado -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">
        
        <!-- Cabeçalho com Foto e Bio -->
        <header class="profile">
            <div class="avatar-wrapper">
                <div class="avatar-glow"></div>
                <img 
                    src="https://github.com" 
                    alt="Foto de perfil de Guilherme Duarte" 
                    class="avatar"
                >
            </div>

            <h1 class="name">Guilherme Duarte</h1>
            <span class="username">@guihzduarte</span>

            <p class="bio">
                Programador e estudante • JavaScript, HTML, CSS3 e Back-end.
            </p>
        </header>

        <!-- Lista de Links -->
        <section class="links">
            
            <!-- GitHub -->
            <a href="https://github.com" target="_blank" rel="noopener noreferrer" class="link-card">
                <div class="link-content">
                    <div class="icon-box">
                        <i class="fa-brands fa-github"></i>
                    </div>
                    <div class="link-text">
                        <h2>GitHub</h2>
                        <p>Meus repositórios e códigos</p>
                    </div>
                </div>
                <i class="fa-solid fa-arrow-up-right-from-square arrow-icon"></i>
            </a>

            <!-- LinkedIn / Portfólio -->
            <a href="https://linkedin.com" target="_blank" rel="noopener noreferrer" class="link-card">
                <div class="link-content">
                    <div class="icon-box">
                        <i class="fa-brands fa-linkedin-in"></i>
                    </div>
                    <div class="link-text">
                        <h2>LinkedIn & Portfólio</h2>
                        <p>Trajetória profissional e conexões</p>
                    </div>
                </div>
                <i class="fa-solid fa-arrow-up-right-from-square arrow-icon"></i>
            </a>

            <!-- Instagram -->
            <a href="https://instagram.com" target="_blank" rel="noopener noreferrer" class="link-card">
                <div class="link-content">
                    <div class="icon-box">
                        <i class="fa-brands fa-instagram"></i>
                    </div>
                    <div class="link-text">
                        <h2>Instagram</h2>
                        <p>Perfil pessoal e dia a dia</p>
                    </div>
                </div>
                <i class="fa-solid fa-arrow-up-right-from-square arrow-icon"></i>
            </a>

        </section>

        <!-- Rodapé -->
        <footer class="footer">
            <p>Desenvolvido por <span>Guilherme Duarte</span></p>
        </footer>

    </main>

</body>
</html>
